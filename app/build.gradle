plugins {
    id 'com.android.application'
}

android {
    namespace 'com.faheem.panelscan'
    compileSdk 34

    defaultConfig {
        applicationId 'com.faheem.panelscan'
        minSdk 21
        targetSdk 27          // panel is Android 8.1 (API 27)
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}
