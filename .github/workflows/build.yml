name: build-apk

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: panel-scan-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Direct download link for the panel's browser (repo must be public):
      # https://github.com/<user>/<repo>/releases/download/latest/app-debug.apk
      - name: Publish APK to release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "latest" --notes "Auto build"
          gh release upload latest app/build/outputs/apk/debug/app-debug.apk --clobber
